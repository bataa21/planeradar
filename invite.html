<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071521">
  <meta name="description" content="Join a private Plane Radar online battle room.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="✈️ Plane Radar Game Invitation">
  <meta property="og:description" content="A friend invited you to battle in Plane Radar. Tap to join the room.">
  <meta property="og:image" content="https://bataa21.github.io/planeradar/icons/plane-radar-share.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Plane Radar aircraft and radar icon">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="✈️ Plane Radar Game Invitation">
  <meta name="twitter:description" content="A friend invited you to battle in Plane Radar. Tap to join the room.">
  <meta name="twitter:image" content="https://bataa21.github.io/planeradar/icons/plane-radar-share.png">
  <title>✈️ Plane Radar Invitation</title>
  <link rel="icon" type="image/png" sizes="192x192" href="https://bataa21.github.io/planeradar/icons/icon-192.png?v=5.0.9.3">
  <link rel="apple-touch-icon" href="https://bataa21.github.io/planeradar/icons/apple-touch-icon.png?v=5.0.9.3">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071521;color:#fff;font:16px/1.5 monospace;text-align:center}
    main{width:min(88vw,360px);padding:28px;border:1px solid #365266;border-radius:16px;background:#102636}
    img{width:112px;height:112px;border-radius:24px}
    a{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:8px;background:#fff;color:#071521;font-weight:bold;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <img src="icons/plane-radar-share.png" alt="Plane Radar icon">
    <h1>✈️ Plane Radar</h1>
    <p id="message">Opening your invitation…</p>
    <a id="continueLink" href="./">Open game</a>
  </main>
  <script>
    (() => {
      const code = (new URLSearchParams(location.search).get('room') || '').replace(/\D/g, '').slice(0, 6);
      const destination = code.length === 6 ? `./?room=${code}` : './';
      const link = document.getElementById('continueLink');
      link.href = destination;
      if (code.length === 6) {
        document.getElementById('message').textContent = `Room ${code} · Opening the game…`;
        setTimeout(() => location.replace(destination), 120);
      } else {
        document.getElementById('message').textContent = 'This invitation has no valid room code.';
      }
    })();
  </script>
</body>
</html>
